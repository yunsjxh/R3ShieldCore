# ============================================================
#  预设：日常防护（mode=block + 文件监控）
#
#  用法：复制本文件覆盖 r3shieldcore.ini，重启引擎。
#  未列出的项 = 引擎内置默认值（与随包 r3shieldcore.ini 相同）。
#  各项含义见「配置详解.md」。
#
#  ★ v129 起 block 按**后果类型**分流（这条决定了它能不能日常用）：
#
#      破坏类 → 拦：注册表持久化（Run/IFEO/服务/计划任务）、系统文件、
#                   驱动加载、服务权限、COM 劫持、令牌窃取、跨进程注入
#      知情类 → 默认只记录：摄像头/麦克风、输入钩子、截屏、剪贴板读取
#
#    知情类硬拒的表现不是"被拦了"，而是"功能坏了"——
#    剪贴板拒了 = 粘贴失效；截屏拒了 = 截图黑屏；
#    摄像头拒了 = 视频通话打不开；钩子拒了 = 输入法打不出字。
#    它们仍会进日志（WOULD-BLOCK + 高危），只是不打断你。
#
#  ★ v132 起「知情类」的处置**可以逐面调**（见下面 privacy_* 四行）：
#      record = 只记录不打断（默认）
#      ask    = 弹窗询问，由你决定这一次
#      block  = 直接拒绝（老行为）
#    想更严就挑一两个面改成 ask（比如只对摄像头弹窗），
#    别四个一起改成 block —— 那等于退回 v128 的"系统坏了"体验。
#
#    ★ 要连隐私面一起无条件拦：改用 mode=block_all（它"不看豁免、不询问"）。
# ============================================================

mode=block                  # 主动防御：拦破坏类，隐私类按 privacy_* 处置
hook_file=1                 # 打开文件监控（高危文件规则依赖它；噪音比默认大）

# ---- 隐私面处置（v132，只在 mode=block 下生效）----
# 推荐起步：摄像头 / 麦克风改 ask（真要用时问一句，误伤最小、知情最强），
# 其余三个保持 record。改完必须重启引擎。
privacy_camera=record       # 想"开摄像头必问"就改成 ask
privacy_input_hook=record
privacy_screen=record
privacy_clipboard=record

# ★ v49：绝不注入名单（完整路径前缀，可重复）。被排除的进程一个 hook 都不挂；
#   代价 = 它和它拉起的子进程失去同步注入路（退回 inject_interval_ms 轮询）。
#   说明见 r3shieldcore.ini 里的「绝不注入名单」小节。
# ★ 默认留空。曾经写死过开发机的 `D:\Program Files\MyApp\`，
#   对别的机器无意义 ⇒ 挪成示例。需要时照下面格式填你自己的路径：
# never_inject=C:\Program Files\SomeElectronApp\

# ★ 回传数据替换（spoof_reg / spoof_reg_enum / spoof_clipboard / spoof_screen /
#   spoof_camera / spoof_file）**全部默认关**，本预设不启用。
#   需要时到 r3shieldcore.ini 的「自定义保护」与「文件读替换」小节看说明再打开 ——
#   它们是"主动欺骗"能力（调用成功、数据是假的），会改变被注入进程看到的内容，
#   不适合默认开启。spoof_file 还会额外装 4 个文件 hook（整机最热路径）。
