# ============================================================
#  预设：日常防护（mode=block + 文件监控）
#
#  用法：复制本文件覆盖 r3shieldcore.ini，重启引擎。
#  未列出的项 = 引擎内置默认值（与随包 r3shieldcore.ini 相同）。
#  各项含义见「配置详解.md」。
# ============================================================

mode=block                  # 主动防御：只拦高危，正常程序照用
hook_file=1                 # 打开文件监控（高危文件规则依赖它；噪音比默认大）

# ★ v49：绝不注入名单（完整路径前缀，可重复）。被排除的进程一个 hook 都不挂；
#   代价 = 它和它拉起的子进程失去同步注入路（退回 inject_interval_ms 轮询）。
#   说明见 r3shieldcore.ini 里的「绝不注入名单」小节。
# ★ 默认留空。曾经写死过开发机的 `D:\Program Files\MyApp\`，
#   对别的机器无意义 ⇒ 挪成示例。需要时照下面格式填你自己的路径：
# never_inject=C:\Program Files\SomeElectronApp\
