# ============================================================
#  R3ShieldCore 配置
#  改完保存 -> 重启引擎生效。
#
#  ★ v66：**引擎优先读 `%ProgramData%\R3 Shield Core\r3shieldcore.ini`**。
#     安装程序会把本文件复制到那里，并只对**那个目录**授 Users:(OI)(CI)M ——
#     所以普通用户直接改那份就能保存，不需要管理员。
#     安装目录（Program Files）**刻意不给用户写权限**（否则恶意程序能改杀软本体）。
#     若 ProgramData 下那份不存在（绿色包 / 旧安装），引擎回退读本目录里的同名文件。
#     ⇒ 装了安装包之后，**改的是 ProgramData 那份**，改这里的不会生效。
#
#  mode：log 只记录 ｜ block 主动防御（本包默认）｜ ask 拦截+弹窗 ｜ block_all 全拦·不弹窗（★破坏性）
#        ｜ test 便捷写法 = log 的行为 + 强制要求 test_inject_only= 非空（见下方「限定注入范围」）
#
#  ★ v129 起 block 的语义按**后果类型**分流（这是"能不能日常用"的分界线）：
#
#      破坏类 → **拦**：注册表持久化（Run/IFEO/服务/计划任务）、系统文件、
#                      驱动加载、服务权限、COM 劫持、令牌窃取、跨进程注入
#      知情类 → **只记录，不拦**：摄像头/麦克风、输入钩子、截屏、剪贴板读取
#
#    为什么知情类不拦：它们的判据是"需要你知道"，不是"会破坏数据"。硬拒的表现
#    不是"被拦了"，而是"功能坏了"——
#      剪贴板 Read 是每次 Ctrl+V 都走的热路径 ⇒ 拒了 = 粘贴失效
#      截屏 ⇒ 拒了 = 截图工具黑屏
#      摄像头/麦克风 ⇒ 拒了 = 视频通话打不开
#      输入钩子 ⇒ 拒了 = 输入法打不出字 / 游戏按键失灵
#    这四类在日志里仍会出现（标 WOULD-BLOCK + 高危），只是不打断。
#    ★ 要连隐私面一起拦：用 mode=block_all（它本来就"不看豁免、不询问"）。
#
#  ★ 每个开关的覆盖范围 / 判据 / 盲区，见同目录「配置详解.md」。
#  ★ 想整套换预设：用 r3shieldcore-block.ini 等覆盖**生效的那份**（见「预设说明.txt」）。
# ============================================================

# ---------- 模式与询问 ----------
mode=block                  # 主动防御：拦破坏类（持久化/系统文件/服务/驱动/注入），
                            # 隐私类（摄像头/麦克风/输入钩子/截屏/剪贴板）只记录不拦（本包默认）
prompt_timeout=30           # ★只对 ask 模式有效：弹窗等多少秒算超时（block_all 不弹窗、不看它）
prompt_default=deny         # ★只对 ask 模式有效：超时 / 不理会时的兜底（block_all 恒拒，不看它）

# ---------- 总开关 ----------
high_risk=1                 # 内置高危规则表（建议保持 1）
self_protect=1              # 引擎自我保护：挡别人杀引擎 / 挂引擎（建议保持 1）

# ---------- 跨重启保留界面信息（★ v54 新增）----------
# 引擎的界面信息（累计事件数、事件列表）原来是**纯内存**的 —— 关掉再开就归零。
# 下面三项让它跨重启连续，效果就是"重启程序后界面里还能看到以前的信息"。
#
#  persist_stats=1  ：退出时把累计计数落到同目录 r3shieldcore-stats.json，下次启动读回来。
#     累计的「监控事件」总数、注入进程数会接着上次算，不会每次重启都从 0 开始。
#     落盘是原子的（写 .tmp 再改名），中途断电不会留下半个文件。
#     ⚠️ 只统计数字，不含任何事件内容；不想留痕就设 0。
#  replay_history_log=1 ：启动时读 r3shieldcore-events.log 的尾部，把上一轮的事件
#     重新灌进界面列表（带 [史] 前缀 + 灰底，和本轮实时事件区分）。
#     ⚠️ 只读**日志文件**，不读内存；所以日志被删/被截断就自然没有历史。
#  replay_history_limit=200 ：回放多少条。只是**界面显示**的限制，
#     不影响统计累计，也不影响日志文件本身写多少。范围 1..2000。
persist_stats=1
replay_history_log=1
replay_history_limit=200

# ---------- 瘦注入（★ 决定"双击启动 / UAC 提权启动"能不能零盲区）----------
# 引擎有两条注入路：
#   ① 同步路：在**父进程**里拦 CreateProcessInternalW -> 强制子进程挂起 ->
#      注入 hook -> 再放行。子进程**跑第一行代码之前**就被监控（盲区≈0）。
#   ② 轮询路：定期扫新进程再注入（盲区 = inject_interval_ms + 注入耗时）。
# ① 的前提是**父进程已被注入**。而"双击启动"的父进程是 explorer.exe、
# "UAC 提权启动"的父进程是 svchost.exe —— 它们原来在"绝不注入"名单里，
# 于是那两条链**永远拿不到同步路**（样本 Windows XP Horror 就是抢这个窗口）。
#
# 本项 = 1：把 explorer.exe / svchost.exe / runtimebroker.exe 也**注进去**，
#   但**只装 CreateProcessInternalW 一个 hook**（瘦会话），不装任何 guard
#   —— 它们自己不受监控（行为等价于"没被注入"），但它们拉起的子进程
#   能走同步路，盲区≈0。★ 这是 v42 为"启动即写 MBR"的样本加的关键一项。
#   本项 = 0：退回旧行为（不注入它们，只靠轮询）。★ 逃生门。
inject_shell_thin=1

# ---------- 注入扫描间隔（★ 盲区大小 = 这个值）----------
# 新进程要等引擎"注入"进去才会被监控。轮询间隔就是**未受保护的时间窗**。
# 样本 Windows XP Horror 在进程启动后几十~几百 ms 内就写 MBR，
# 所以间隔必须远小于它。空转时一轮只是一次 NtGetNextProcess 调用，开销可忽略。
# 范围 1..1000，默认 10（毫秒）。★ 调大 = 更省 CPU、但盲区变大（不安全）。
inject_interval_ms=10

# ---------- 注册表 ----------
hook_reads=0                # 连"读"注册表也记录（噪音极大，默认关）
log_all_open=0              # NtOpenKey 不管读写意图都记录（默认只记带写意图的）
hook_hive=1                 # hive 级操作：加载 / 保存 / 替换整棵子树
hook_set_info=1             # NtSetInformationKey：改键属性（时间戳伪造 / WOW64 重定向）

# ---------- 文件 ----------
hook_file=0                 # 文件 建/写/删/改名/截断/改ACL（比注册表热得多，默认关）

# ---------- 裸盘 / 引导区（★独立于 hook_file）----------
hook_raw_disk=1             # 写 \\.\PhysicalDrive0 等裸盘 = 改引导区（bootkit），默认拦

# ---------- 进程 / 线程 / 内存 ----------
hook_process=1              # 进程创建 / 终止
hook_thread=1               # 线程创建（只报跨进程的远程线程 = 注入）
hook_self_thread=0          # 连本进程内创建线程也记（极高频，默认关）
hook_terminate_contain=1    # 终止收敛：只许退自己/后代/同镜像；杀别人 = 高危
hook_memory_op=1            # 跨进程内存 Alloc / Write / Protect（代码注入链）

# ---------- 驱动 / 服务 ----------
hook_driver=1               # 驱动加载 / 卸载（NtLoadDriver + SCM 服务 API）
hook_service_config=1       # 服务 / 安全对象权限变更（sc sdset 提权）

# ---------- 网络 ----------
hook_net=1                  # ws2_32 连接 / 发送 / 绑定 / 监听 / 接受
hook_dns=1                  # DNS 查询（只记录，永不判高危）
hook_net_all=0              # 连 bind/listen/accept 也挂（服务端程序极高频，默认关）

# ---------- 隐私采集面 ----------
hook_camera=1               # 摄像头 / 麦克风打开
# ★ 摄像头「帧替换」（v73，默认关）：本应**拒绝读取摄像头数据流**时，改为
#   **返回中性帧** —— 读取器照常建成功，但之后**每一帧**都被原地改掉，
#   调用方以为在录，其实拿到的是一帧帧"合法的空白画面"（日志里记 SPOOF）。
#   只在 mode=block / ask 下生效；mode=log 本来就不拒、mode=block_all 一律拒绝。
#   前置条件：必须同时 hook_camera=1。
#   ★ 中性值**与像素格式有关**：RGB 类 -> 全 0（就是黑）；YUV 类 -> Y16/UV128
#     （有限范围的黑）。⚠️ 别把它理解成"统一填 0"—— YUV 里全 0 是**饱和色**，
#     不是黑。支持：RGB32 / ARGB32 / RGB24 / YUY2 / UYVY / NV12 / I420 / IYUV / YV12。
#   ★ 只挂得上**一条**路：MFCreateSourceReaderFromMediaSource（Media Foundation
#     的取帧入口）。VFW（WM_CAP_* 回调）、设备源创建、以及音频三路都**回落拒绝**。
#     ⇒ 打开本开关**不会**让麦克风 / 环回被放行；建读取器时若**没有视频流**，
#       同样回落拒绝。
#   ★ 压缩子类型（MJPG / H264 等）**取帧时回落拒绝** —— 往压缩帧里填中性值
#     得到的是"一帧解不出来的垃圾"，造不出合法替代物就不硬造。
#   已知盲区（非本开关引入）：直接走 VFW / DirectShow 的采集、设备源自带的
#   回调、以及内核态采集路径都没覆盖。定位是提高成本，不是硬边界。
spoof_camera=0              # 0=关闭（默认）  1=开启（本应拒绝的摄像头取帧改为返回中性帧）
hook_input=1                # 输入钩子（SetWindowsHookEx / RawInput）
hook_screen=1               # 截屏（BitBlt / PrintWindow）
# ★ 截屏「替换」（v67，默认关）：本应**拒绝**截屏时，改为**返回黑帧** ——
#   调用方以为截到了，其实拿到一张黑图（日志里记 SPOOF）。
#   只在 mode=block / ask 下生效；mode=log 本来就不拒、mode=block_all 一律拒绝。
#   前置条件：必须同时 hook_screen=1。
#   已知盲区（非本开关引入）：GetPixel 逐像素读屏、Desktop Duplication、
#   WinRT 屏幕捕获都没挂 —— 换这些路径仍能拿到真画面。定位是提高成本，不是硬边界。
spoof_screen=0              # 0=关闭（默认）  1=开启（本应拒绝的截屏改为返回黑帧）
# ★ 截屏替换的**内容来源**（v134，默认空 = 仍为黑帧）。
#   填一个图片路径 => 被截取的区域被**拉伸铺满**这张图，而不是涂黑。
#   只认 BMP（底层是 LoadImageW）：PNG/JPG 要 WIC/GDI+，
#   那要在**被注入进程**里初始化 COM —— 而这段代码跑在 BitBlt 热路径上。
#   读不到 / 不是合法图片 => **回落黑帧**（失败方向永远是「更像假」）。
#   改图不用重启：按（路径 + 文件修改时间）缓存，改完下一次截屏就是新图。
#   配置工具里叫「替换 · 屏幕来源图」（「回传数据替换」分区）。
spoof_screen_image=        # 例：C:\fake\desktop.bmp（留空 = 黑帧）
hook_audio=1                # 音频采集（环回 / 麦克风）
hook_clipboard=1            # 剪贴板读取（Open 只记录，取走数据才高危）
# ★ 剪贴板「替换」（v70，默认关）：本应**拒绝**读取剪贴板时，改为**返回中性内容** ——
#   文本变空串；位图 / DIB 变同尺寸全 0（BGR 下即全黑）。调用方以为成功了，
#   其实拿到的是空壳（日志里记 SPOOF）。
#   只在 mode=block / ask 下生效；mode=log 本来就不拒、mode=block_all 一律拒绝。
#   前置条件：必须同时 hook_clipboard=1。
#   ★ 只对能伪造的格式生效：CF_TEXT(1) / CF_BITMAP(2) / CF_OEMTEXT(7) /
#     CF_DIB(8) / CF_UNICODETEXT(13) / CF_DIBV5(17)。其余格式（如注册格式、
#     CF_HDROP）**回落到拒绝** —— 造不出未知格式的合法布局。
#   已知盲区（非本开关引入）：OLE 拖放 IDataObject::GetData、
#   win32u!NtUserGetClipboardData、延迟渲染（WM_RENDERFORMAT）都没挂 ——
#   换这些路径仍能拿到真内容。定位是提高成本，不是硬边界。
spoof_clipboard=0           # 0=关闭（默认）  1=开启（本应拒绝的剪贴板读取改为返回中性内容）
hook_input_inject=1         # 合成输入 / 锁屏勒索（SendInput / BlockInput / ClipCursor）

# ---------- 隐私面：命中之后怎么办（v132）----------
#
# 与上面「hook_*」是**两件事**：
#   hook_camera=1    = 要不要监控（装不装 hook）
#   privacy_camera   = 监控到了、判定高危之后**怎么处置**
#
# 三个取值：
#   record —— 只记录 + 标 WOULD-BLOCK，**不打断使用**（默认）
#   ask    —— **弹窗询问**：允许就照做，拒绝才拒
#   block  —— **直接拒绝**（v128 之前 block 的老行为）
#
# ★ 只在 mode=block 下起作用：
#     mode=log       恒记录（不看这一层）
#     mode=ask       恒询问（不看这一层）
#     mode=block_all 恒拒绝（全拦模式不开后门）
#
# ★ 为什么默认是 record：block 是随包预设，装上去第一小时就要能用。
#   剪贴板 Read 每次 Ctrl+V 都走，默认 ask 会弹窗轰炸、默认 block 会让
#   粘贴直接失效 —— 两种都会让人以为系统坏了。要更严自己拨。
#
# ★ 改完**必须重启引擎**才生效（位在 Policy 里，注入 DLL 只在
#   LoadLibrary 时读一次）。cfg 界面保存后会提示重启。
#
# ★ 与 spoof_* 的关系：record / block 两档都会先看替换开关 ——
#   "调用成功、数据是假的"比"只记录"保护得更好，也比"硬拒"不打断。
privacy_camera=record       # 摄像头 / 麦克风（选 block 会让视频通话打不开）
privacy_input_hook=record   # 输入钩子（选 block 会让输入法 / 游戏 / 远控装不上钩子）
privacy_screen=record       # 截屏（选 block 会让截图 / 录屏 / 会议共享拿不到画面）
privacy_clipboard=record    # 剪贴板读取（选 block 会让 Ctrl+V 失效）

# ---------- 持久化 / 劫持面 ----------
hook_dll_load=1             # DLL 加载劫持（LdrLoadDll / 手工映射 / 侧加载）
hook_spawn=1                # 进程创建旁路（WinExec / ShellExecute / 令牌）
hook_com_hijack=1           # COM/OLE 激活劫持（CLSID -> 用户可写 DLL）
hook_scheduled_task=1       # 计划任务持久化
hook_token_theft=1          # 令牌窃取 / 冒充
hook_wmi_subscription=1     # WMI 事件订阅持久化
hook_host_hijack=1          # 宿主劫持 / 加载器（注入键 + 远程映射 + APC）

# ---------- 窗口反制 ----------
# 反制全屏+置顶的覆盖层窗口（锁屏勒索 / 假 UAC / 假登录框）。
#   0 = 关闭
#   1 = 开启，**不问**：五级直接执行
#   2 = 开启，**每级执行前弹窗询问**（居中置顶小窗）
#
# 五级升级：① 最小化 -> ② 请求关闭 -> ③ 销毁窗口 -> ④ 调用退出函数 -> ⑤ 杀进程
# ⚠️ ④⑤ 会**结束目标进程**，所以默认取 2（询问）—— 免得把正常全屏游戏/播放器
#    当成勒索软件直接杀掉。要"不问直接执行"就改成 1。
#
# ★ 询问的三种结局（v59 起区分）：
#   · 点「反制」/「不再询问」 -> 执行本级的动作；
#   · 点「跳过」/ 按 Esc / 点 X -> **用户明确拒绝**，本进程不再打扰；
#   · **超时无人应答** -> 只代表"这次没结论"，**不是**拒绝 ⇒ 会重试，
#     连续 3 次无应答才放弃（并写日志告诉你）。这一条很重要：覆盖层攻击时
#     弹窗很可能被覆盖层盖住 —— 旧版把超时当"跳过"，反制会在第一级就被永久关掉。
#     要"不管有没有人答都直接执行"就改成 1。
neutralize_overlay=2

# ---------- 高危进程提示（★ v61 新增）----------
# 引擎定期快照**全机**进程，逐个判"是不是高危"。不依赖注入覆盖、
# 也不依赖观测窗 —— 引擎启动前就在跑的进程一样能看见。只"告知"不"拦截"。
#
# 判据（刻意收窄，正常机器上基本无输出）：
#   ① 系统进程名伪装：文件名 == svchost.exe 等，但不在系统目录
#   ② 形近伪装：lsass .exe / svch0st.exe / scvhost.exe
#   ③ 已知攻击工具：mimikatz / procdump / rubeus …
#   ④ 你自己点名的：命中 protect_process= 的程序（复用同一份名单，
#      没配 protect_process= 时这条恒不命中）
#
#   high_risk_process_alert=2  ：记录 + 界面底部栏显示最近一条（默认）
#   high_risk_process_alert=1  ：仅记录（r3shieldcore-console.log + 统计）
#   high_risk_process_alert=0  ：关闭
#   high_risk_process_scan_ms=1000 ：扫描间隔（毫秒，范围 200..60000）
#      比注入轮询（10ms）慢两个数量级是刻意的：本功能是"告知"不是"拦"，
#      1 秒足够；而且枚举 + 逐个查映像路径是真开销（系统调用 + 打开进程）。
high_risk_process_alert=2
high_risk_process_scan_ms=1000
# 判据 ④ 的名单来自这里（默认注释掉；语法见《配置详解.md》第十二节）：
# protect_process=D:\MyApp\critical.exe

# ---------- ARK 全机进程视图（★ v62 新增）----------
# 界面上的「ARK」页签：列出**全机**进程（不受注入覆盖影响，受保护进程也在
# 列表里），并支持对选中进程执行 挂起 / 恢复 / 内部退出 / 强制结束。
#
# 与「进程」页的区别：
#   · 「进程」页 = 事件聚合，只有**产生过事件**的进程才在列表里；
#     没被注入的进程（never_inject / 位数不匹配 / 权限不足）根本不会出现。
#   · 「ARK」页 = Toolhelp 快照，**所有**进程都在，包括引擎启动前就在跑的。
#
#   ark_enabled=1 ：启用（默认）—— 只定期枚举进程列表，不做任何主动行为
#   ark_enabled=0 ：关闭 —— ARK 页签仍在，但列表不刷新、动作按钮不可用
#   ark_scan_ms=2000 ：**引擎**多久重新枚举一次全机进程（毫秒，范围 500..60000）
#      比 high_risk_process_scan_ms 再慢一倍是刻意的：每一轮要**打开每个
#      进程**（路径 / CPU / 内存 / 模块表），比只查路径贵得多；而它服务的是
#      "人看的列表"，2 秒刷新完全够用。
#   ark_refresh_ms=1000 ：**界面**多久重取 + 重绘一次（毫秒，范围 200..60000）
#      ⚠️ 它和 ark_scan_ms 是**两件事**，别混：
#         ark_scan_ms    = 数据新鲜度（引擎枚举全机进程的节奏）
#         ark_refresh_ms = 显示新鲜度（界面重取缓存 + 重画的节奏）
#      刷新比扫描快是正常的：快照是引擎侧缓存，重取它几乎不花钱，但能让
#      "点了按钮 / 换了选中项 / 动作结果回来"这些**界面侧**变化立刻反映出来。
#      ⇒ 进程列表本身最快也只能跟上 ark_scan_ms；把 ark_refresh_ms 调小
#        **不会**让列表更新更快，只是界面更跟手；调大则纯粹省 CPU。
#
# 列表顺序（v63）：① 普通进程·已注入  →  ② 普通进程·未注入  →  ③ 系统进程。
#   组内按 pid 升序。引擎侧排好序后再交给界面 —— 所以导出 / 日志 /
#   以后的命令行看到的都是同一个顺序。
#   ⚠️ 路径读不出来的进程**归普通组**（不按名字猜成系统进程）；
#      模块表读不出（如 PPL）的归"未注入"组，但界面上仍显示注入状态为"?"。
#
# ⚠️ 四个动作**只由你在界面上点击触发**，引擎绝不会自己动手。
# ⚠️ 安全边界（引擎强制，不是界面约定）：
#      · 引擎自己 ⇒ 三个动作全拒
#      · 关键系统进程（smss / csrss / wininit / winlogon / services / lsass /
#        lsaiso / fontdrvhost / dwm / System / Idle）⇒ 三个动作全拒
#        （结束会立刻蓝屏 CRITICAL_PROCESS_DIED，挂起会整机卡死）
#      · 普通系统进程（svchost / explorer / SearchHost …）⇒ **允许**
#        它们是系统二进制，但既不蓝屏也不卡死，正是 ARK 最该能动的目标
# ⚠️ 「内部退出」对 **32 位进程不可用**（跨位数：64 位引擎无法在 32 位目标里
#    建远程线程）—— 引擎会明确报 WOW64_UNSUPPORTED，改用「强制结束」。
# ⚠️ 引擎退出时会**自动恢复**它挂起过的进程，不会给你留一堆冻住的进程。
ark_enabled=1
ark_scan_ms=2000
ark_refresh_ms=1000

# ---------- 排除目录（前缀匹配，大小写不敏感，可重复）----------
# 把自己的工具 / 业务目录加进来，免得被拦。
#   ⚠️ 只作用于**注册表**判据：镜像在这个目录下的进程，注册表操作不再判高危。
#      它**不会**让该进程不被注入（要那个效果用下面的 never_inject=）。
# exclude=C:\Program Files\YourApp
# exclude=D:\MyData

# ---------- 绝不注入名单（完整路径前缀，大小写不敏感，可重复）★ v49 新增 ----------
# 列在这里的程序，引擎**完全不注入**它们。
#
# 与 exclude= 的区别：
#   · exclude=       —— **注册表**判据上的白名单（进程照样被注入、照样有 hook）
#   · never_inject=  —— **注入**层面的白名单（进程里一个 hook 都没有）
#
# ⚠️ 代价：被排除的进程**自己不受监控**，而且**它拉起的子进程也拿不到同步注入路**
#    （只能靠 inject_interval_ms 轮询，盲区从 ≈0 变成 10ms+）。
#    所以只给"我确定安全、而且注入会把它弄坏 / 日志太吵"的程序用。
#
# ⚠️ 必须写**完整路径**（不要只写文件名）：按文件名匹配等于给攻击者一张
#    "改个名就免注入"的免死金牌。写目录要带结尾 `\`，或直接写 exe 全路径。
#    例：
#      never_inject=C:\Program Files\MyDevTool\        （整个目录）
#      never_inject=D:\Sandbox\sandbox-host.exe        （单个程序）
#
# ★ 这里**默认留空**（一行都不写）。曾经在开发机上写过
#   `never_inject=D:\Program Files\MyApp\` —— 那是**开发机的专属路径**，
#   对别的机器毫无意义，而且等于把"作者用什么工具"写进了发布物。
#   所以它被挪到下面当示例：Electron / .NET 这类进程被注入后容易崩
#   （实测 MyApp.exe、OfficeClickToRun.exe 都被 hook 打崩过），
#   你自己遇到同类崩溃时，照这个格式加你**本机**的那条即可。
# never_inject=C:\Program Files\SomeElectronApp\

# ---------- 限定注入范围（★ 只给开发/验证用；日常别开）----------
# 它解决一个很具体的麻烦：**本机跑端到端验证**时，引擎会全局注入所有进程 ——
# 包括你正在用的编辑器 / IDE，一旦被 hook 就可能直接崩。本节把注入范围缩到
# **下面名单里的进程**，其余一律跳过，于是开发机上可以安全地跑真引擎。
#
# ★★ 两件事是**解耦**的，别混：
#   · 本节的名单   = **注入范围**（哪些进程会被注入）—— 只要名单非空就生效；
#   · `mode=`      = **拦截行为**（放行 / 记录 / 拦截 / 弹窗）。
#   所以「`mode=block` + 本节名单」是合法且有用的组合：只注入目标进程，
#   同时在它身上真拦真记 —— 这正是端到端验证需要的（截屏替换只在"本应拒绝"
#   时才生效，若把拦截行为也退化成 log 就永远验证不到替换路径）。
#
# ★ `mode=test` 是便捷写法，等价于「`mode=log` + 要求本节名单非空」：
#   只记录、全部放行，并且**强制**你写清楚要注入谁。适合"只想看看某进程的
#   事件流"的场景。
#
# 语义：
#   · 白名单**取代**三档分类与 `never_inject=`：只有命中名单的进程会被注入。
#     （白名单是"只有这些"，黑名单是"除了这些"，同时生效只会让人困惑。）
#   · 匹配规则（与 never_inject= 同一套写法）：
#       含 `\` 或 `/` ⇒ **完整路径前缀**（带路径边界，`D:\tools` 命中
#                        `D:\tools\a.exe`，不命中 `D:\tools2\a.exe`）
#       不含分隔符     ⇒ **镜像基名**（不区分大小写，例 `a.exe`）
#
# ⚠️ 名单之外的进程**完全不受监控**（一个 hook 都没有），而且**它拉起的子进程
#    也拿不到同步注入路**。这就是"为了在开发机上安全地跑"付出的代价 ——
#    验证完请把本节整行删掉（或注释掉）再重启。
# ⚠️ 写了 `mode=test` 却把本节留空 ⇒ 注入范围会缩成"零个进程"（引擎看着在跑、
#    实际全盲）。所以引擎会**拒绝启动**并说明原因（fail-closed），而不是默默
#    跑一个什么都不监控的实例。
# ⚠️ 运行期点「切换模式」按钮**不会**动本节（它只改 `mode=` 那一行）——
#    所以"切一下模式就把白名单弄丢了"这件事不会发生。
#
# 可重复写多行，也可以用逗号分隔写一行。上限 16 条。
# 例（端到端夹具）：
#   mode=test
#   test_inject_only=spoof_e2e_target.exe
#   test_inject_only=D:\dev\my_target.exe

# ---------- 自定义保护：注册表（前缀匹配，大小写不敏感，可重复）★ v60 ----------
# 命中即视为高危，无论 mode 是什么都会按高危处置。
#
# ★ v60 修：两种写法**等价** ——
#     protect_reg=SOFTWARE\MyCompany\Critical                    （相对写法，文档用法）
#     protect_reg=\REGISTRY\MACHINE\SOFTWARE\MyCompany\Critical  （完整写法）
#   用户 hive 会自动跳过 \REGISTRY\USER\S-1-5-21-...\ 那段 SID。
#   （v60 之前只认完整写法 ⇒ 照文档配的相对写法一条都命中不了，而且完全静默。）
#
# 现成配方 ——「恶作剧 / 骚扰类」改动。这几项**故意不在内置高危表里**：
# 它们本来就是**用户自己**点「鼠标设置 / 显示桌面图标 / 换壁纸」时被正常写入的，
# 一刀切拦会把系统设置界面弄坏。要防就按需打开下面几行：
#
# protect_reg=Control Panel\Mouse                                               # SwapMouseButtons -> 左右键互换
# protect_reg=Control Panel\Desktop                                             # Wallpaper        -> 壁纸被换
# protect_reg=Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced       # HideIcons        -> 桌面只剩壁纸没图标
# protect_reg=Software\Microsoft\Windows\CurrentVersion\Policies\System         # DisableTaskMgr   -> 任务管理器被禁
#
# ⚠️ 打开后你自己在设置里改这几项也会被拦（那就是它的工作方式）。
#    要改设置时先注释掉、重启引擎，改完再打开。
#
# ★ 注册表值「替换」（v71，默认关）—— 让受保护的值**读不到**：
#   读取上面 protect_reg 命中的键的值时，返回「成功 + 数据区全 0」，
#   值类型与长度字段**一个都不变**（REG_SZ -> 空串，REG_DWORD -> 0，
#   REG_BINARY -> 全 0，REG_MULTI_SZ -> 空列表）。配合上面的「写不进」，
#   合起来就是 **「保护 = 写不进 + 读不到」**。
#   ⚠️ 必须配了 protect_reg 才有效 —— 名单为空时本开关一个字节都不会动。
#   ⚠️ 触发面**只认 protect_reg**，不认内置高危表（那张表含 ...\CurrentVersion\Run，
#      任务管理器 / 启动项管理天天在读，替换会打坏正常软件）。
#   ⚠️ 已知盲区：枚举（NtEnumerateValueKey）**不隐藏** —— 仍能看见值的名字与类型
#      （只是拿到 0 值）。要连名字一起藏，开下面的 spoof_reg_enum=。
#      NtQueryMultipleValueKey 没挂；直接读 hive 文件、事务注册表（KTM）没覆盖。
spoof_reg=0
# spoof_reg=1
#
# ★ 注册表枚举「隐藏」（v72，默认关）—— 让受保护的项**看不见**：
#   枚举上面 protect_reg 命中的键的子键 / 值时，命中保护前缀的项
#   会**从列表里去掉**（调用方看到的是一个更短的、但每一项都真实的列表）。
#   配合 spoof_reg 的「读不到」与既有的「写不进」，合起来即
#   **「保护 = 写不进 + 读不到 + 看不见」**。
#   ⚠️ 必须配了 protect_reg 才有效 —— 名单为空时本开关一项都不会藏。
#   ⚠️ 与 spoof_reg 是**两个独立的开关**：值替换只改值的内容（列表长度不变），
#      枚举隐藏改的是**列表长度与顺序**（按"第几个"索引的程序会看到整体前移）。
#      想只让值读不到、但枚举照旧，就只开 spoof_reg。
#   ⚠️ 隐藏是**列表级**的，不是**访问级**的 —— 知道名字仍可直接打开/查询
#      （值还会被 spoof_reg 清零）。NtQueryKey 返回的 SubKeys/Values 计数不变。
spoof_reg_enum=0
# spoof_reg_enum=1

# ---------- 自定义保护：文件 + 文件读替换 ★ v133 ----------
# protect_file= 前缀匹配（大小写不敏感，可重复写多行）。它被三处共用：
#   ① 高危判定：命中即按高危处置（文件写 / DLL 加载 / COM 服务器路径都认它）
#   ② spoof_file：读这些路径的文件时，回传内容被清零（见下）
#   ③ protect_process 的镜像路径判定（同一份名单）
# 例：
# protect_file=D:\secret\
# protect_file=C:\Users\me\Documents\vault\
#
# ★ 文件读「替换」（v133，默认关）—— 让受保护的文件**读不到真内容**：
#   读上面 protect_file 命中的文件时，NtReadFile 照常**成功返回**，
#   但调用方缓冲区被写成**全 0**；长度 / 状态码 / 偏移语义**一个都不变**。
#   ⇒ 目标程序"文件打开了、也读到了、长度也对"，只是内容不是真的。
#   配合上面的「写不进」，合起来即 **「保护 = 写不进 + 读不到」**
#   （与 spoof_reg 对注册表是同一套语义）。
#
#   ⚠️ 必须配了 protect_file 才有效 —— 名单为空时本开关一个字节都不会动。
#   ⚠️ **与 mode 无关**：文件读从来不会被拒（拒了全系统都起不来），
#      所以这里不存在"本应拒绝"这个前提 ⇒ mode=log 下**也会**清零。
#      这一点与 spoof_screen / spoof_clipboard（只在应拒时替换）**不同**。
#   ⚠️ 打开它会连带安装 4 个 hook（NtCreateFile / NtOpenFile /
#      NtReadFile / NtClose）—— 文件 I/O 是整机最热的路径，所以默认关。
#   ⚠️ 已知盲区（都是真实的绕过路径，定位是"提高成本"不是硬边界）：
#      · **内存映射**（CreateFileMapping + MapViewOfFile）完全不经过
#        NtReadFile —— 这是最大的洞，映射进来能拿到完整真内容；
#      · **异步 / 重叠 I/O**（NtReadFile 返回 STATUS_PENDING）不覆盖 ——
#        数据稍后由内核写入，此刻清零没用；也不能"先拒掉"
#        （I/O 已提交，调用方释放缓冲区后内核再写 = 目标进程内存损坏）；
#      · NtReadFileScatter / 进程启动前就打开的句柄（继承、复制）/
#        直 syscall / CopyFile 的内核拷贝路径 —— 均未覆盖。
spoof_file=0
# spoof_file=1
#
# ★ 六个 spoof_* 现在也能在配置工具里直接勾：
#   r3shieldcore-cfg.exe -> 左栏「回传数据替换」。
#   （v133 之前它们只能手改这里；高级页那行「总闸(ini)」仍然只**显示**，
#     因为它要看的是 ini 文件真相，不看界面里还没保存的勾选。）
