# ============================================================
#  预设：强隔离 + 系统基本可用（block_all_safe）
#
#  全拦，但"可信来源（系统目录 + 微软签名）的进程创建"直接放行 ——
#  系统目录里的程序（记事本 / 计算器 / 任务管理器）能正常启动；
#  **人双击启动的程序一律被拒**。
#
#  ★ v66 起与 block_all 的唯一区别就是上面这一条：
#    两者都**不弹窗**（v21~v65 的"人启动的会弹窗"已撤销）。
#
#  用法：复制本文件覆盖 r3shieldcore.ini，重启引擎。
#  ⚠️ 安装版请复制到 %ProgramData%\R3 Shield Core\ 那一份（v66 起优先读它）；
#     绿色版复制到 exe 同目录。改哪一份以引擎启动横幅打印的路径为准。
#  ⚠️ 仍需把自家工具目录加进 never_inject=，否则它们拉起的程序起不来。
#  未列出的项 = 引擎内置默认值（与随包 r3shieldcore.ini 相同）。
#  详见「模式选择说明.md」。
# ============================================================

mode=block_all_safe         # 全拦；可信来源的进程创建直接放行
hook_file=1                 # 打开文件监控

# ★ v49：绝不注入名单（完整路径前缀，可重复）。说明见 r3shieldcore.ini 同名小节。
#   默认留空（原本写死了开发机专属路径，已挪成示例）：
# never_inject=C:\Program Files\SomeElectronApp\
