# ============================================================
#  预设：完全拦截（★破坏性，别日常用）
#
#  探测范围内一律直接拒 —— ★ v66 起**不弹窗、不问用户**。
#  （v21~v65 曾把 进程创建/远程线程/跨进程内存/注册表写/文件写
#    改成"弹窗询问"，v66 已全部撤销：全拦就是全拦。）
#
#  两处例外（都是刻意的，见「模式选择说明.md」）：
#    · 注册表 / 文件的**普通档**（正常软件写自己的配置）→ 静默放行，
#      否则会重现 v25 的"桌面软件全打不开"；
#    · UAC 同意框本体（真实系统盘 System32 下的 consent.exe 等三个）→ 放行，
#      否则连提权框都起不来。
#
#  ⚠️ 会导致被注入的第三方程序大面积失灵（症状：
#     "程序打不开 / Windows 无法访问指定设备"）。这是故意的，不是 bug。
#  仅适合：隔离环境 / 取证 / 演示。
#
#  用法：复制本文件覆盖 r3shieldcore.ini，重启引擎。
#  ⚠️ 安装版请复制到 %ProgramData%\R3 Shield Core\ 那一份（v66 起优先读它）；
#     绿色版复制到 exe 同目录。改哪一份以引擎启动横幅打印的路径为准。
#  未列出的项 = 引擎内置默认值（与随包 r3shieldcore.ini 相同）。
#  详见「模式选择说明.md」。
# ============================================================

mode=block_all              # 完全拦截
hook_file=1                 # 打开文件监控

# ★ v49：绝不注入名单（完整路径前缀，可重复）。说明见 r3shieldcore.ini 同名小节。
#   默认留空（原本写死了开发机专属路径，已挪成示例）：
# never_inject=C:\Program Files\SomeElectronApp\
