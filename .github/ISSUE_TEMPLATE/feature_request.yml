name: 功能建议
description: 新 guard、新规则、新配置项、体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提之前先想一下

        本项目**只做用户态**，且**内核驱动刻意不拦截**（内核里每条分支都是开机风险）。
        所以「加个内核回调来拦 X」这类建议大概率会被拒 —— 请优先给用户态方案。

        新增 hook 有一个隐性成本：**每一个未公开 ABI 的原型写错都不报错，只是静默失效**。
        所以请说明你打算怎么验证它真的挂上了。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说方案。不要只写"加个 XXX hook"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么做
      description: 挂在哪个模块？哪几个 API？归入现有的哪一类 `ObjectType`，还是新增一类？
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: 落在哪一层
      options:
        - 引擎 hook 层（新增 guard / 新增 hook 点）
        - 规则层（`r3shieldcore_rules.cpp`）
        - 配置 / 模式语义
        - GUI / 日志
        - 构建 / 安装 / 发布
        - 文档
        - 不确定
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: 怎么验证它真的生效
      description: 有探针思路吗？（`tools/` 里 60+ 个探针就是干这个的）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案 / 为什么现有的不行
    validations:
      required: false
